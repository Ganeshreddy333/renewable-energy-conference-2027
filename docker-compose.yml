version: "2.4"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: conference_db
      MYSQL_USER: conf_user
      MYSQL_PASSWORD: secure_password_123
      MYSQL_ROOT_PASSWORD: root_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://conf_user:secure_password_123@mysql:3306/conference_db
      SHADOW_DATABASE_URL: mysql://conf_user:secure_password_123@mysql:3306/conference_db_shadow
      JWT_SECRET: replace_with_a_long_random_secret
      JWT_EXPIRATION: 24h
      API_PORT: 3001
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend/storage:/app/storage
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql_data:
